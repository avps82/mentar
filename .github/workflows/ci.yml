# gitleaks CLI (MIT) run directly — gitleaks-action requires a commercial license for orgs
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c constraints.txt -e ".[dev,web,grounding]"
      - run: python -m pytest tests/ -q
      - run: ruff check .

  # The 7 headless-browser checks (tests/web/test_browser_ui.py).
  #
  # Why a SEPARATE job on ONE interpreter, not part of the matrix above: a
  # headless browser is the flakiest thing in this repo, and when it wobbles it
  # must show up as "browser checks" rather than dragging all three Pythons red.
  #
  # Why it exists at all: until 2026-08-16 CI ran `pytest tests/` and reported
  # "1001 passed, 7 skipped -- websocket not installed" on EVERY run. Those 7
  # checks had never once executed in CI. That is exactly how a real rendering
  # bug shipped on 2026-08-15 (an explain-more card 16px against 16.8px prose):
  # the test for it was correct and simply never ran.
  #
  # The skip-guard in the last step is the whole point. If the browser or the
  # client goes missing again this FAILS, instead of quietly reporting skips and
  # a green tick -- which is the failure mode it was built to end.
  browser:
    name: browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -c constraints.txt -e ".[dev,web,grounding]"

      - name: Provide a `chromium` binary
        # test_browser_ui.py discovers the browser with shutil.which("chromium").
        # Runners ship google-chrome-stable, so alias whatever is present rather
        # than installing a second browser.
        run: |
          set -euo pipefail
          bin=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          if [ -z "$bin" ]; then
            echo "::error::no chromium/chrome on this runner image"; exit 1
          fi
          sudo ln -sf "$bin" /usr/local/bin/chromium
          chromium --version

      - name: Browser checks (must actually run)
        run: |
          set -uo pipefail
          out=$(python -m pytest tests/web/test_browser_ui.py -q -rs 2>&1); rc=$?
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qE '[0-9]+ skipped'; then
            echo "::error::browser checks SKIPPED -- this job exists to stop exactly that"
            exit 1
          fi
          exit $rc

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks scan (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # --redact keeps the matched value out of a public log.
          # NOTE: -v was added on 2026-08-15 to print WHICH finding, and it does
          # NOT do that here -- run 31889978126 logged only "WRN leaks found: 2"
          # with -v set. The report file is the reliable channel, so the next step
          # prints it rather than relying on the flag. Left in place; harmless.
          ./gitleaks git . --no-banner --redact -v --report-path gitleaks-report.json

      # Print WHICH secret, in the log, without re-running or downloading an
      # artifact. Values are already redacted by --redact above.
      - name: Show gitleaks findings
        if: failure()
        run: |
          python3 -c "import json;[print(f\"{f['RuleID']}  {f['File']}:{f['StartLine']}  commit {f['Commit'][:8]}\") for f in json.load(open('gitleaks-report.json'))]"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # A18: prompt body-hash changes invalidate the last recorded T1.5 safety-eval
  # claim (docs/EVAL_RESULTS.md). Reminder only — does not run the eval itself
  # (eval is run-only/off-CI, see AGENTS.md).
  prompt-eval-reminder:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for prompts/ changes
        id: changed
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          if git diff --name-only "origin/$GITHUB_BASE_REF" "$GITHUB_SHA" -- prompts/ | grep -q .; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@v9
        if: steps.changed.outputs.touched == 'true'
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### ⚠️ `prompts/` changed — safety-eval re-run required (A18)',
                '',
                'This PR touches a file under `prompts/`. Per `AGENTS.md` / `CONTRIBUTING.md`:',
                '- [ ] Re-ran the T1.5 adversarial suite through the pipeline against the new prompt text',
                '- [ ] Recorded the run date + result in `docs/EVAL_RESULTS.md` next to the existing claim',
                '',
                '(Reminder only — CI does not run the eval itself; eval is run-only/off-CI.)',
              ].join('\n'),
            })
