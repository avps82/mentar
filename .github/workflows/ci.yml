# gitleaks CLI (MIT) run directly — gitleaks-action requires a commercial license for orgs
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c constraints.txt -e ".[dev,web,grounding]"
      - run: python -m pytest tests/ -q
      - run: ruff check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact

  # A18: prompt body-hash changes invalidate the last recorded T1.5 safety-eval
  # claim (docs/EVAL_RESULTS.md). Reminder only — does not run the eval itself
  # (eval is run-only/off-CI, see AGENTS.md).
  prompt-eval-reminder:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for prompts/ changes
        id: changed
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          if git diff --name-only "origin/$GITHUB_BASE_REF" "$GITHUB_SHA" -- prompts/ | grep -q .; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@v9
        if: steps.changed.outputs.touched == 'true'
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### ⚠️ `prompts/` changed — safety-eval re-run required (A18)',
                '',
                'This PR touches a file under `prompts/`. Per `AGENTS.md` / `CONTRIBUTING.md`:',
                '- [ ] Re-ran the T1.5 adversarial suite through the pipeline against the new prompt text',
                '- [ ] Recorded the run date + result in `docs/EVAL_RESULTS.md` next to the existing claim',
                '',
                '(Reminder only — CI does not run the eval itself; eval is run-only/off-CI.)',
              ].join('\n'),
            })
