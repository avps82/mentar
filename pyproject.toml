[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mentar"
version = "0.1.0.dev0"
description = "OSS-first, local-first AI tutor for children — supplements school, never replaces it."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Mentar maintainers" }]
keywords = ["tutor", "education", "kids", "oss", "local-llm", "kst", "bkt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]

dependencies = [
  "pyyaml>=6.0",
  "openai>=1.0",
  # B0 (2026-08-11): expression answer-type for Y9+ algebra — simplify(a-b)==0
  # is the whole equivalence check. Import is LAZY in verify_numeric.py (module
  # still imports without it; expression checks SAFE_REJECT with a clear detail).
  "sympy>=1.12",
  # Ground-truth computation libs, adopted 2026-08-11 (maintainer: batch-adopt now
  # so no future content wave blocks on an install, and never hand-roll what these
  # cover). Same architecture as sympy: the library COMPUTES truth for generators/
  # verifiers, our thin gates stay the safety boundary, imports stay lazy at the
  # point of use. All three are light, pure-Python, long-maintained:
  "pint>=0.24",       # unit conversion (Y5+ measurement, physics-adjacent maths)
  "inflect>=7.0",     # English plurals/articles/ordinals (English word-form generators)
  "num2words>=0.5",   # number->words, multi-locale (lower years; SG/IN English variants)
]

[project.optional-dependencies]
web = [
  "flask>=3.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.100",
  "ruff>=0.5",
]
inference-ollama = [
  "ollama>=0.3",
]
setup = [
  # `mentar setup` hardware detection. psutil gives accurate cross-OS RAM (stdlib
  # sysconf is POSIX-only — Windows needs this). gguf-parser is a downloaded binary,
  # not a Python dep; the GGUF runtime additionally needs llama-cpp-python (installed
  # on demand). HF GGUFs are fetched over plain HTTPS (no extra dep).
  "psutil>=5.9",
]
nas = [
  # SMB/Samba client for reading/downloading ZIMs from a NAS via smb:// URLs.
  # Not needed when the share is mounted in the OS (libzim reads the mount directly).
  "smbprotocol>=1.12",
]
grounding = [
  # ZIM reader for offline grounding (SPEC §15). Imported LAZILY — grounding degrades
  # gracefully to "" without it, so it's opt-in, not a core/runtime requirement. libzim
  # has spotty wheels (macOS arm64 only on cp313/py3.13 + macOS>=13; none for 3.11/3.12),
  # so as a core dep it blocks install on common Macs. Install with this extra when you
  # want grounding — on Apple Silicon use Python 3.13 (for the prebuilt wheel) or
  # `brew install libzim` first.
  "libzim>=3.10",
]
offline-fit = [
  # pyBKT is OFFLINE-ONLY (post-pilot BKT model fitting at N>=100; see
  # docs/design/W3.3_bkt.md). The live tutor uses the owned pure-Python recurrence in
  # engine/bkt.py and never imports pyBKT — so it is NOT a runtime/install dependency
  # (it ships C++/Cython extensions that fail to build on a plain machine, e.g. macOS
  # without a toolchain). Install only when running the offline fit.
  "pyBKT>=1.4",
]

[project.scripts]
mentar = "mentar.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mentar*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "llm: tests that require a live LLM backend (skipped on the build host; run on eval host)",
  "slow: tests that take >5s",
  "human_gated: tests that require a human action (consent, review, child session)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines tolerated. UP042: our enums are deliberate `(str, Enum)`; switching to
# StrEnum changes str()/format semantics (we rely on explicit .value), so we decline it.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test + script conventions: inline python3 smoke-runners need sys.path before imports (E402);
# compact one-liner fakes / lambdas in fixtures (E702/E731/E741); test zip without strict (B905).
"tests/**" = ["E402", "E702", "E731", "E741", "B905"]
"scripts/**" = ["E741"]
