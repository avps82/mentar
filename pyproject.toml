[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mentar"
version = "0.1.0.dev0"
description = "OSS-first, local-first AI tutor for children — supplements school, never replaces it."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Mentar maintainers" }]
keywords = ["tutor", "education", "kids", "oss", "local-llm", "kst", "bkt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]

dependencies = [
  "pyyaml>=6.0",
  "pyBKT>=1.4",
  "libzim>=3.10",
  "openai>=1.0",
]

[project.optional-dependencies]
web = [
  "flask>=3.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.100",
  "ruff>=0.5",
]
inference-ollama = [
  "ollama>=0.3",
]
setup = [
  # `mentar setup` hardware detection. psutil gives accurate cross-OS RAM (stdlib
  # sysconf is POSIX-only — Windows needs this). gguf-parser is a downloaded binary,
  # not a Python dep; the GGUF runtime additionally needs llama-cpp-python (installed
  # on demand). HF GGUFs are fetched over plain HTTPS (no extra dep).
  "psutil>=5.9",
]
nas = [
  # SMB/Samba client for reading/downloading ZIMs from a NAS via smb:// URLs.
  # Not needed when the share is mounted in the OS (libzim reads the mount directly).
  "smbprotocol>=1.12",
]

[project.scripts]
mentar = "mentar.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mentar*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "llm: tests that require a live LLM backend (skipped on the build host; run on eval host)",
  "slow: tests that take >5s",
  "human_gated: tests that require a human action (consent, review, child session)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines tolerated. UP042: our enums are deliberate `(str, Enum)`; switching to
# StrEnum changes str()/format semantics (we rely on explicit .value), so we decline it.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test + script conventions: inline python3 smoke-runners need sys.path before imports (E402);
# compact one-liner fakes / lambdas in fixtures (E702/E731/E741); test zip without strict (B905).
"tests/**" = ["E402", "E702", "E731", "E741", "B905"]
"scripts/**" = ["E741"]
