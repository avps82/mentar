{% extends "_base.html" %}
{% block title %}Mentar — Choose a topic{% endblock %}
{% block content %}
<p style="text-align:center;color:var(--text-muted);max-width:480px;margin:0 auto 8px">
  Your private learning helper — everything stays on this computer.
</p>
<h2 style="text-align:center;color:var(--text)">What would you like to learn today?</h2>
<div class="subject-grid">
  {% for key, s in subjects.items() %}
  <form method="POST" action="/choose">
    <input type="hidden" name="subject" value="{{ key }}">
    <button class="subject-card" type="submit">
      <span class="subject-icon">{{ s.icon }}</span>
      {{ s.label }}
      {% if s.description %}<div class="subject-desc">{{ s.description }}</div>{% endif %}
      {% set p = subjects_progress.get(key) %}
      {% if p %}<div class="subject-progress">{{ p.mastered }} of {{ p.total }} skills mastered</div>{% endif %}
    </button>
  </form>
  {% endfor %}
</div>
{% endblock %}
