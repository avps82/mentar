<svg width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- badge background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#191A2E"/>
  <!-- moon -->
  <circle cx="32" cy="31" r="21" fill="#FFF3DB"/>
  <!-- faint craters -->
  <circle cx="22" cy="22" r="3.2" fill="#F3E4C2"/>
  <circle cx="41" cy="17.5" r="2.2" fill="#F3E4C2"/>
  <circle cx="45" cy="27" r="1.6" fill="#F3E4C2"/>
  <!-- clouds crossing the moon edges -->
  <path d="M4 27 C8 24.5, 12 24.5, 15 27 C18 25, 22 25.5, 24 28 L24 30.5 L4 30.5 Z" fill="#191A2E"/>
  <path d="M46 41.5 C48.5 39.5, 52 39.5, 54.5 41.5 C57 40, 59.5 40.5, 61 42.5 L61 45 L46 45 Z" fill="#191A2E"/>
  <!-- ground swoosh the figure sits on -->
  <path d="M13 46 C22 42.5, 42 42.5, 51 46 L51 49.5 C40 46.5, 24 46.5, 13 49.5 Z" fill="#191A2E"/>
  <!-- ═ Minator silhouette, profile facing right ═ -->
  <g fill="#191A2E">
    <!-- ONE continuous bull profile: back of skull, forehead dipping into a
         proper muzzle, chin, throat, hunched back down to the seat -->
    <path d="M26.2 45
             C23.2 39.5, 23.4 31.5, 26.6 27
             C26.2 25.4, 26.6 23.4, 27.8 22
             C29.2 20.4, 31.4 19.8, 33.2 20.6
             C34.8 21.3, 36.2 22.8, 37.4 24.6
             C38.2 25.8, 38.2 27, 37.2 27.4
             C36.2 27.8, 34.8 27.6, 33.8 27.2
             C33.4 29.5, 33 32.5, 33.2 35.5
             C33.4 39, 33.6 42, 34 45 Z"/>
    <!-- nostril notch: tiny moon-coloured dot on the muzzle -->
    <circle cx="36.1" cy="25.9" r="0.55" fill="#FFF3DB"/>
    <!-- horns: sweeping crescents off the skull -->
    <path d="M27.4 21.2 C24.4 18.6, 23.6 14.6, 25.6 11.4 C25.4 15, 26.8 18, 29.4 19.6 Z"/>
    <path d="M31.8 20 C31 16.4, 32.2 12.6, 35.2 10.6 C33.4 13.8, 33.2 17.2, 34.6 20 Z"/>
    <!-- ear flick behind the horn -->
    <path d="M26.4 22.6 C24.8 22, 23.4 22.4, 22.6 23.6 C24 23.7, 25.2 24.2, 26 25 Z"/>
    <!-- folded legs forward -->
    <path d="M33 39.5 C36.5 37.8, 40.5 38.2, 43.4 40.4 L43.4 45 L33.4 45 Z"/>
    <!-- arm reaching to the book -->
    <path d="M31.6 30.6 C33.4 29.8, 35.2 29.8, 36.8 30.8 L36 33.8 C34.6 33, 33.2 33.1, 32.2 33.7 Z"/>
    <!-- open book with a clear V page-split at the spine -->
    <path d="M40.8 27.6 L35.2 30.8 L37 39.4 L41.6 37 L40.9 30.4 Z"/>
    <path d="M41.4 27.6 L47 29.6 L45.8 37.8 L42.2 37 L41.7 30.4 Z"/>
    <!-- little tail resting on the ground -->
    <path d="M23.8 44 C21.2 43.4, 19.6 44.4, 19.2 46 C20.8 45.2, 22.4 45.2, 24 45.6 Z"/>
  </g>
  <!-- stars, top right on the dark -->
  <g fill="#FFF3DB">
    <path d="M52.5 6.5 l1 2.3 2.3 1 -2.3 1 -1 2.3 -1 -2.3 -2.3 -1 2.3 -1 Z"/>
    <path d="M58 12.5 l0.7 1.6 1.6 0.7 -1.6 0.7 -0.7 1.6 -0.7 -1.6 -1.6 -0.7 1.6 -0.7 Z"/>
  </g>
</svg>
