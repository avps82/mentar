# Model roster for T1.2 (response generation). See docs/MODEL.md for roles + the eval host.
# Served via the OpenAI-compatible eval proxy; endpoint+key come from env
# (MENTAR_VLLM_BASE_URL / MENTAR_VLLM_API_KEY) — never written here.
#
# role: candidate (local OSS, under test) | ceiling (quality upper bound, NOT a pilot pick)
#       | judge (grades outputs)          | dev (Claude Code agent, not a tutor candidate)
# quant: "unknown" until confirmed on the host (W1.3 reproducibility).
# vram: APPROX GPU memory bucket (4-bit unless the tag says otherwise, ~4-8k context); a model
#       can still run with less by spilling to CPU/RAM (slower). status: queued = not yet run.
models:
  - {name: "phi4-mini",            source: ollama,    params: "~3.8B", quant: unknown, role: candidate, tier: low-end,     vram: "<4 GB"}
  - {name: "qwen3.5:2b",           source: ollama,    params: "~2B",   quant: unknown, role: candidate, tier: low-end,     vram: "<4 GB"}
  - {name: "llama3.1:8b",          source: ollama,    params: "8B",    quant: unknown, role: candidate, tier: mid,         vram: "<6 GB"}
  - {name: "gemma2:9b",            source: ollama,    params: "9B",    quant: unknown, role: candidate, tier: mid,         vram: "<8 GB"}
  - {name: "qwen3.5:9b",           source: ollama,    params: "~9B",   quant: unknown, role: candidate, tier: mid,         vram: "<8 GB"}
  - {name: "qwen3:14b",            source: ollama,    params: "14B",   quant: unknown, role: candidate, tier: capable-gpu, vram: "<10 GB"}
