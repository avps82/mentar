# Mentar inference config — EXAMPLE (committed).
#
# Copy this to config/inference.yaml (which is GITIGNORED) and fill it in.
# NEVER put a real secret in THIS example file — the pre-commit hook will block it.
#
# Best practice: keep secrets in environment variables and reference them here as
# ${VAR}. The loader expands ${VAR} from the environment at runtime. If you must
# inline a key, put it ONLY in config/inference.yaml (gitignored), never here.

backend: llamacpp        # one of: llamacpp | vllm | ollama | gemini | claude  (SPEC §20.1, §21)

# Local llama.cpp (GGUF) — PRIMARY default: lightest runtime, broadest hardware support
# (CPU / Apple Metal / modest GPU). Two modes:
llamacpp:
  mode: "server"                          # "server" (OpenAI-compatible llama-server) | "in_process" (llama-cpp-python)
  # server mode (reuses the OpenAI-compatible provider path, same as vLLM/NIAH):
  base_url: "http://localhost:8080/v1"    # llama-server endpoint
  api_key: "${MENTAR_LLAMACPP_API_KEY}"   # from env; llama-server often accepts any token
  # in_process mode:
  model_path: "${MENTAR_GGUF_PATH}"       # path to the .gguf weights (final pick = W1.3)
  n_ctx: 8192
  n_gpu_layers: 0                         # 0 = CPU-only; raise to offload to GPU

# Local vLLM cluster (OpenAI-compatible) — capable-GPU / throughput tier; also the eval host.
vllm:
  base_url: "http://localhost:8000/v1"   # your local vLLM endpoint
  model: "REPLACE_ME"                     # served model id (final pick = W1.3)
  api_key: "${MENTAR_VLLM_API_KEY}"       # from env; do NOT inline a real key here

# Local Ollama (no key needed).
ollama:
  base_url: "http://localhost:11434"
  model: "REPLACE_ME"

# Opt-in cloud backends (parent owns the key). Leave unset for the local-only pilot.
gemini:
  api_key: "${GEMINI_API_KEY}"
  model: "REPLACE_ME"
claude:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "REPLACE_ME"
