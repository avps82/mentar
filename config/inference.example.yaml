# Mentar inference config — EXAMPLE (committed).
#
# Copy this to config/inference.yaml (which is GITIGNORED) and fill it in.
# NEVER put a real secret in THIS example file — the pre-commit hook will block it.
#
# Best practice: keep secrets in environment variables and reference them here as
# ${VAR}. The loader expands ${VAR} from the environment at runtime. If you must
# inline a key, put it ONLY in config/inference.yaml (gitignored), never here.

backend: llamacpp        # one of: llamacpp | vllm | ollama | gemini | claude  (SPEC §20.1, §21)

# Local llama.cpp (GGUF) — PRIMARY default: lightest runtime, broadest hardware support
# (CPU / Apple Metal / modest GPU). Two modes:
llamacpp:
  mode: "server"                          # "server" (OpenAI-compatible llama-server) | "in_process" (llama-cpp-python)
  # server mode (reuses the OpenAI-compatible provider path, same as vLLM/NIAH):
  base_url: "http://localhost:8080/v1"    # llama-server endpoint
  api_key: "${MENTAR_LLAMACPP_API_KEY}"   # from env; llama-server often accepts any token
  # in_process mode:
  model_path: "${MENTAR_GGUF_PATH}"       # path to the .gguf weights (final pick = W1.3)
  n_ctx: 8192
  n_gpu_layers: 0                         # 0 = CPU-only; raise to offload to GPU

# Local vLLM cluster (OpenAI-compatible) — capable-GPU / throughput tier; also the eval host.
vllm:
  base_url: "http://localhost:8000/v1"   # your local vLLM endpoint
  model: "REPLACE_ME"                     # served model id (final pick = W1.3)
  api_key: "${MENTAR_VLLM_API_KEY}"       # from env; do NOT inline a real key here

# Local Ollama (no key needed).
ollama:
  base_url: "http://localhost:11434"
  model: "REPLACE_ME"

# Opt-in cloud backends (parent owns the key). Leave unset for the local-only pilot.
gemini:
  api_key: "${GEMINI_API_KEY}"
  model: "REPLACE_ME"
claude:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "REPLACE_ME"

# ══ Grounding / ZIM-reader (W7) ═══════════════════════════════════════════════
# SPEC §15 (layer-1 RAG): feeds vetted offline text into {{grounding_passage}} in
# prompts/system_prompt.md so the local model re-explains FROM a source instead of
# hallucinating. Grounding is TEXT-ONLY by design (media/interactivity = W6.5/W7.6).
#
# ZIM = the offline web-archive files (Kiwix). They are large binaries — NEVER commit
# them (*.zim is gitignored). Download with scripts/fetch_zim.py (local / NAS / smb://).
#
#   FULL GUIDE — sources, licences, mirrors, fallbacks, download recipes:  config/README.md
#   Design / contract:                                                     docs/design/W7_grounding_reader.md
grounding:

  # ── Where the .zim files live ───────────────────────────────────────────────
  # Accepts THREE forms (see config/README.md → "Where ZIMs live"):
  #   local path          "/data/zims"
  #   mounted NAS / share "/mnt/nas/zims"  or  "Z:\\zims"   (mount in the OS — no SMB cfg)
  #   SMB URL / UNC       "smb://nas/share/zims" or "\\\\nas\\share\\zims"
  #                       (needs the [nas] extra; the ZIM is copied once to zim_cache_dir)
  zim_dir: "${MENTAR_ZIM_DIR}"

  # ── Which ZIM each curriculum `source:` resolves to ─────────────────────────
  # Declare a source by the PARTS of its Kiwix filename; the reader auto-picks the
  # NEWEST matching file in zim_dir, so you never re-edit this on a ZIM update:
  #
  #     <project>_<lang>_<selection>_<flavour>_<YYYY-MM>.zim
  #        │        │        │           │         └─ build date — latest wins automatically
  #        │        │        │           └─ maxi (text+images) | nopic (text only) | mini (intros)
  #        │        │        └─ "all" (whole project) | a subject e.g. "astronomy" | "simple_all"
  #        │        └─ language code: en, ace, fr, …
  #        └─ project: vikidia | wikipedia | wikibooks | gutenberg | phet | …
  #
  # The dict KEY is the curriculum `source:` enum (also drives the anchor scope guard).
  # `pin:` overrides "latest" with a build date ("2026-02") or an exact filename.
  # A plain string value is still accepted as an exact filename (no auto-latest).
  # → See config/README.md → "Other sources & licences" before adding new ones.
  sources:
    vikidia:                       # child-friendly encyclopaedia (CC BY-SA 3.0)
      project:   vikidia
      lang:      en
      selection: all
      flavour:   nopic             # text only — smallest; ideal for text-LLM grounding
      # pin:     "2026-04"         # uncomment to freeze a build (or give an exact *.zim)
    wikipedia_simple:              # Simple English Wikipedia (CC BY-SA 4.0)
      project:   wikipedia
      lang:      en
      selection: simple_all
      flavour:   nopic
    # ── Examples (uncomment / adapt) ──
    # astronomy:                   # a SUBJECT slice of full English Wikipedia, with images
    #   project:   wikipedia       #   anchors are on en.wikipedia.org → needs a scope-guard
    #   lang:      en              #   host entry (see config/README.md → "Adding a new source")
    #   selection: astronomy
    #   flavour:   maxi
    # wikibooks: "wikibooks_en_all_nopic_2025-12.zim"   # plain string = exact filename

  max_passage_chars: 1200          # cap passage length fed to the model (small-model budget)

  # ── Caches ──────────────────────────────────────────────────────────────────
  cache: { enabled: true, dir: "${MENTAR_GROUNDING_CACHE:-.cache/grounding}" }  # resolved-passage memo
  zim_cache_dir: "${MENTAR_ZIM_CACHE:-.cache/zim}"   # local copies of smb:// ZIMs (NOT for mounted NAS)

  # ── SMB / Samba credentials ─────────────────────────────────────────────────
  # ONLY needed when zim_dir is an smb:// URL or UNC path. For an already-mounted
  # share, leave enabled:false. Keep real secrets in env / the gitignored
  # config/inference.yaml — never in this example file.
  smb:
    enabled: false
    username: "${MENTAR_SMB_USER}"
    password: "${MENTAR_SMB_PASSWORD}"
    domain:   "${MENTAR_SMB_DOMAIN:-}"
