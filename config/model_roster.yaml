    params_b: 9
    reasoning: false
    tier: mid
    rank: 3
    min_ram_gb: 7
    note: "Strong vetted mid-tier default; good fit for 16 GB (incl. MacBook Pro M1 16 GB)."

  - id: qwen3.5-9b
    ollama_tag: "qwen3.5:9b"
    params_b: 9
    reasoning: false
    tier: mid
    rank: 4
    min_ram_gb: 7

  - id: llama3.1-8b
