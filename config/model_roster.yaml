# Mentar vetted model roster — drives `mentar setup` auto-selection.
#
# These are the ONLY models setup will install: candidates from the Mentar eval
# roster (docs/MODEL.md, eval/models.yaml) — NOT a generic "best model" list. A
# child tutor must run a safety/pedagogy-vetted model, then constrained to what fits.
#
# Ordered best -> worst by `rank` (1 = highest capability). `mentar setup` walks this
# list and picks the FIRST model that fits the detected hardware comfortably.
#
# Fields:
#   id          stable key
#   ollama_tag  pullable via `ollama pull` (primary runtime)
#   hf_repo/hf_file  a Q4_K_M GGUF for the in-process fallback runtime (optional;
#                    provisional — verify before relying on it; ollama-only if absent)
#   params_b    parameter count (billions) — used by the heuristic fallback sizing
#   reasoning   true => emit generation.extra_body.think=false (see backend)
#   tier        low-end | mid | capable-gpu  (see docs/hardware-requirements.md)
#   min_ram_gb  heuristic floor (params_b*0.6 + overhead) used only when gguf-parser
#               is unavailable; gguf-parser supersedes this when present.
#
# Ranking is PROVISIONAL until W1.3 finalises the pick; edit freely (data, no code change).

models:
  - id: gemma4-12b
    ollama_tag: "gemma4:12b"
    params_b: 12
    reasoning: true
    tier: capable-gpu
    rank: 1
    min_ram_gb: 9
    note: "Eval: correctness 100%, safety 1.00, sycophancy 1.00; reasoning model (think:false); full-GPU."

  - id: qwen3-14b
    ollama_tag: "qwen3:14b"
    params_b: 14
    reasoning: false
    tier: capable-gpu
