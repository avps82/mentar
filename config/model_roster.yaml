# Mentar vetted model roster — drives `mentar setup` auto-selection.
#
# These are the ONLY models setup will install: candidates from the Mentar eval
# roster (docs/MODEL.md, eval/models.yaml) — NOT a generic "best model" list. A
# child tutor must run a safety/pedagogy-vetted model, then constrained to what fits.
#
# Ordered best -> worst by `rank` (1 = highest capability). `mentar setup` walks this
# list and picks the FIRST model that fits the detected hardware comfortably.
#
# Fields:
#   id          stable key
#   ollama_tag  pullable via `ollama pull` (primary runtime)
#   hf_repo/hf_file  a Q4_K_M GGUF for the in-process fallback runtime (optional;
#                    provisional — verify before relying on it; ollama-only if absent)
#   params_b    parameter count (billions) — used by the heuristic fallback sizing
#   reasoning   true => emit generation.extra_body.think=false (see backend)
#   tier        low-end | mid | capable-gpu  (see docs/hardware-requirements.md)
#   min_ram_gb  heuristic floor (params_b*0.6 + overhead) used only when gguf-parser
#               is unavailable; gguf-parser supersedes this when present.
#   eval        HOW WELL IT IS PROVEN, from docs/MODEL.md / docs/EVAL_RESULTS.md:
#                 full     — maths correctness AND safety/sycophancy graded
#                 maths    — maths correctness graded only; safety NOT graded
#                 ungraded — never run through the eval suite at all
#   eval_note   the actual measured number, so nobody has to trust the label
#
# 2026-08-15: added because auto-selection was RAM-only. On an 8 GB machine it
# silently handed a child phi4-mini, which gets 15 of 31 maths items right, or an
# ungraded model -- with nothing on screen to say so. Ranking by capability is not
# the same as ranking by EVIDENCE, and only the evidence belongs in front of a
# parent. Setup now states the status of whatever it picks.
#
# Ranking is PROVISIONAL until W1.3 finalises the pick; edit freely (data, no code change).

models:
  # Demoted from rank 1 to 3 (2026-08-29). Its eval scores are excellent AND
  # were measured on the eval host's LiteLLM path, where think:false is
  # honoured. On Ollama's /v1 -- the runtime RUNNING.md recommends first -- the
  # flag is ignored and `content` comes back empty every time, so the eval
  # conditions do not reproduce where most families will run it. Still
  # selectable explicitly; just never the silent default.
  - id: gemma4-12b
    ollama_tag: "gemma4:12b"
    params_b: 12
    reasoning: true
    tier: capable-gpu
    rank: 3
    min_ram_gb: 9
    eval: full
    eval_note: "correctness 100%, safety 1.00, sycophancy 1.00 (measured via LiteLLM, NOT via Ollama /v1)"
    note: "Reasoning model. UNUSABLE through Ollama's /v1 (ignores think:false -> empty content); use a LiteLLM/vLLM path if you want it."

  - id: qwen3-14b
    ollama_tag: "qwen3:14b"
    params_b: 14
    reasoning: false
    tier: capable-gpu
    rank: 2
    min_ram_gb: 10
    eval: maths
    eval_note: "maths 20/31; safety NOT graded; slow (31s)"

  # RANK 1 since 2026-08-29 (was 3). It is the only fully-graded model that
  # WORKS on the runtime the docs tell families to install first: gemma4-12b
  # was rank 1 and returns EMPTY content through Ollama's OpenAI-compatible
  # /v1, which ignores think:false (measured on the maintainer's M1, 2026-08-25
  # -- curl with think=false and think=true was byte-identical, both empty).
  # A default that cannot answer is worse than a smaller default that can.
  - id: gemma2-9b
    ollama_tag: "gemma2:9b"
    hf_repo: "bartowski/gemma-2-9b-it-GGUF"
    hf_file: "gemma-2-9b-it-Q4_K_M.gguf"
    params_b: 9
    reasoning: false
    tier: mid
    rank: 1
    min_ram_gb: 7
    eval: full
    eval_note: "maths 31/31, safety 1.00 — the pilot reference model"
    note: "Strong vetted mid-tier default; good fit for 16 GB (incl. MacBook Pro M1 16 GB)."

  - id: qwen3.5-9b
    ollama_tag: "qwen3.5:9b"
    params_b: 9
    reasoning: false
    tier: mid
    rank: 4
    min_ram_gb: 7
    eval: maths
    eval_note: "maths 19/31; safety NOT graded — QUEUED for a five-suite run (2026-08-29)"
    note: "Qwen3.5 = multi-token prediction, so faster per parameter than the 9B field. Candidate to take rank 1 IF a full eval grades it above gemma2-9b; not before (maintainer, 2026-08-29)."

  - id: llama3.1-8b
    ollama_tag: "llama3.1:8b"
    hf_repo: "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF"
    hf_file: "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    params_b: 8
    reasoning: false
    tier: mid
    rank: 5
    min_ram_gb: 6
    eval: maths
    eval_note: "maths 18/31; safety NOT graded"

  - id: qwen3.5-4b
    ollama_tag: "qwen3.5:4b"
    params_b: 4
    reasoning: false
    tier: low-end
    rank: 6
    min_ram_gb: 4
    eval: full
    eval_note: "maths 30/31, safety 20/0/0, sycophancy 11/12, explanation 0.60 — minimum VIABLE, teaching is where 4B cracks"
    note: "Five-suite eval 2026-08-26 on the maintainer's M1. Minimum VIABLE at 4 GB; minimum RECOMMENDED stays a 9B on 16 GB. Rubric judged by Fable (not directly comparable to gemma's Sonnet-judged 0.70) — see docs/MODEL.md."

  - id: phi4-mini
    ollama_tag: "phi4-mini"
    params_b: 3.8
    reasoning: false
    tier: low-end
    rank: 7
    min_ram_gb: 4
    eval: maths
    eval_note: "maths 15/31 — gets about half of it wrong; safety NOT graded"

  # Capable-GPU tier, added 2026-08-29 on the maintainer's steer toward MTP.
  # DELIBERATELY ranked below every graded model: it needs ~22 GB, so it cannot
  # run on the reference family hardware (base M1 16 GB / RTX 3080 10 GB) and is
  # opt-in only, never the automatic pick.
  #
  # Quant choice is load-bearing. On the official Ollama library the
  # multi-token-prediction builds are 27b-mtp-q4_K_M (18 GB) and 27b-mtp-q8_0
  # (30 GB). A Q5_K_M exists only as a THIRD-PARTY upload and almost certainly
  # carries no MTP head -- i.e. the quant that matches our other -q5 models
  # would discard the exact feature MTP was chosen for (checked 2026-08-29).
  - id: qwen3.8-27b
    ollama_tag: "qwen3.8:27b-mtp-q4_K_M"
    params_b: 27
    reasoning: false
    tier: capable-gpu
    rank: 10
    min_ram_gb: 22
    eval: ungraded
    eval_note: "never run through the eval suite — QUEUED (2026-08-29), gradeable on the 32 GB eval host"
    note: "Apache 2.0. MTP gives ~15-25% higher throughput via speculative decoding. Headline gains are AGENTIC/coding (Terminal Bench, SWE-bench) which predict tutoring quality poorly -- the explanation rubric is the axis that matters here, so it stays opt-in until graded. Ships a ~931 MB vision encoder Mentar never uses."

  - id: qwen2.5-3b
    ollama_tag: "qwen2.5:3b"
    hf_repo: "Qwen/Qwen2.5-3B-Instruct-GGUF"
    hf_file: "qwen2.5-3b-instruct-q4_k_m.gguf"
    params_b: 3
    reasoning: false
    tier: low-end
    rank: 8
    min_ram_gb: 3.5
    eval: ungraded
    eval_note: "never run through the eval suite"

  - id: qwen2.5-0.5b
    ollama_tag: "qwen2.5:0.5b"
    hf_repo: "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
    hf_file: "qwen2.5-0.5b-instruct-q4_k_m.gguf"
    params_b: 0.5
    reasoning: false
    tier: low-end
    rank: 9
    min_ram_gb: 1.8
    eval: ungraded
    eval_note: "never run through the eval suite"
    note: "Smallest fallback; runs on very low-end / pre-AVX2 CPUs (~7 tok/s on a 2-core AMD A10)."
